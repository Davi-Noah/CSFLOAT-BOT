services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floatscout}
      POSTGRES_USER: ${POSTGRES_USER:-floatscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floatscout}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floatscout} -d ${POSTGRES_DB:-floatscout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./apps/api/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-floatscout}:${POSTGRES_PASSWORD:-floatscout}@db:5432/${POSTGRES_DB:-floatscout}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-floatscout}:${POSTGRES_PASSWORD:-floatscout}@db:5432/${POSTGRES_DB:-floatscout}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
